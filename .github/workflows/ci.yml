name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run ruff check src/gafour/cli.py src/gafour/update.py tests/test_update.py
      - run: uv run ruff format --check src/gafour/cli.py src/gafour/update.py tests/test_update.py
      - run: uv run pytest
      - run: uv build
      - run: uv run gafour --version
